name: Backend Test Workflow

on:
  push:
    branches:
      - main  # or any specific branches you want to include
    paths:
      - 'ui/backend/**'
      - '.github/workflows/hamilton-ui-backend.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'ui/backend/**'
      - '.github/workflows/hamilton-ui-backend.yml'


jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testdir: [test_lifecycle, test_db_methods]  # Specify your test directories
        # the oldest and newest Python apache-hamilton-ui supports
        python-version: ['3.11', '3.15']
    services:
      postgres:
        # Django 6, which pip resolves on Python 3.12+, needs PostgreSQL 15 or later
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: circleci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 100s
          --health-retries 10
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd ui/backend/server
          pip install -r requirements-base.txt
          pip install -r requirements-test.txt
      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: "postgres"
          DB_NAME: ${{ matrix.testdir }}
          DB_PORT: 5432
          HAMILTON_ENV: integration_tests
          DJANGO_SECRET_KEY: test
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          HAMILTON_BLOB_STORE: local
          HAMILTON_LOCAL_BLOB_DIR: ./blob_data
          HAMILTON_AUTH_MODE: integration_tests
        run: |
          cd ui/backend/server
          python manage.py sqlcreate
          echo $(python manage.py sqlcreate) | psql -U postgres
          python manage.py migrate
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: "postgres"
          DB_NAME: ${{ matrix.testdir }}
          DB_PORT: 5432
          HAMILTON_ENV: integration_tests
          DJANGO_SECRET_KEY: test
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          HAMILTON_BLOB_STORE: local
          HAMILTON_LOCAL_BLOB_DIR: ./blob_data
          HAMILTON_AUTH_MODE: integration_tests
        run: |
          cd ui/backend/server
          python -m pytest tests/${{ matrix.testdir }} -vvvvv
      - name: Install the apache-hamilton-ui package
        # in a fresh venv, so only the dependencies its pyproject.toml declares are installed
        if: matrix.testdir == 'test_lifecycle'
        run: |
          python -m venv "$RUNNER_TEMP/ui-package"
          "$RUNNER_TEMP/ui-package/bin/pip" install ./ui/backend
          cd "$RUNNER_TEMP"
          ui-package/bin/python -c "import hamilton_ui.commands"
