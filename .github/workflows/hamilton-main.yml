name: Unit Tests

on:
  # Pull requests install the committed dependency versions. Scheduled and manual runs
  # refresh the locks, so the daily run tests `main` against what
  # Hamilton's users install, and the notify-slack job reports what broke. The minute is off the
  # hour because GitHub delays or drops scheduled runs at the top of the hour, when most schedules
  # start.
  schedule:
    - cron: '17 4 * * *'

  # To check the Slack webhook, run this workflow by hand on `main` with notify-slack on.
  workflow_dispatch:
    inputs:
      notify-slack:
        description: 'Send a test Slack message with this run''s outcome (apache/hamilton only)'
        type: boolean
        default: false

  pull_request:
    branches:
        - main
    paths:
        - '.github/**'
        - 'examples/**'
        - 'hamilton/**'
        - 'plugin_tests/**'
        - 'tests/**'
        - 'pyproject.toml'
        # tests/test_redirect_packages.py renders every redirect package from these
        - 'scripts/render_redirect_pyproject.py'
        - 'sf-hamilton*-redirect/**'
        - 'uv.lock'
        # `uv.lock` also pins these packages, which pyproject.toml installs from their paths
        - 'dev_tools/language_server/pyproject.toml'
        - 'ui/backend/pyproject.toml'
        - 'ui/sdk/pyproject.toml'

  push:
    branches: [main]
    paths:
      - '.github/ci/**'
      - '.github/workflows/hamilton-main.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dev_tools/language_server/pyproject.toml'
      - 'ui/backend/pyproject.toml'
      - 'ui/sdk/pyproject.toml'

env:
  UV_LOCKED: 1
  UV_VERSION: '0.13.7'
  UV_LINUX_SHA256: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83

jobs:
  static-checks:
    name: "Static Checks"
    # Daily runs on forks have no Slack report.
    if: github.event_name != 'schedule' || github.repository == 'apache/hamilton'
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
            version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'latest' || env.UV_VERSION }}
            checksum: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && env.UV_LINUX_SHA256 || '' }}
            enable-cache: false

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Check committed locks and core dependencies
          run: |
            uv lock --check
            uv lock --check --project .github/ci/polars1
            uv lock --check --project .github/ci/vaex
            uv sync --no-dev
            uv pip check

        - name: Resolve the newest lint dependencies
          if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          env:
            UV_LOCKED: 0
          run: uv lock --upgrade

        - name: Use the newest hook releases
          if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          run: uv run prek update

        - name: Check linting with prek
          if: github.event_name != 'push'
          run: uv run prek run --all-files --hook-stage pre-merge-commit

  locked-sync:
    name: Locked sync (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            uv-checksum: 81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731
          - os: windows-latest
            uv-checksum: 0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the locked test environment
        run: uv sync --group test
      - name: Check installed dependencies
        run: uv pip check

  test:
    name: "Unit Tests"
    if: github.event_name != 'push' && (github.event_name != 'schedule' || github.repository == 'apache/hamilton')
    runs-on: ${{ matrix.os }}
    # A healthy leg takes up to about 30 minutes; a hung test would otherwise hold it for GitHub's
    # 6-hour default and delay the canary's Slack report.
    timeout-minutes: 60
    strategy:
      fail-fast: false # want to see for each version if fails are different
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    env:
      HAMILTON_TELEMETRY_ENABLED: false
    services:
      # disposable server for the SQL lineage tests; they create and drop their own schemas
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hamilton
          POSTGRES_PASSWORD: hamilton
          POSTGRES_DB: sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        - name: Install Graphviz
          run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends graphviz

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
            version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'latest' || env.UV_VERSION }}
            checksum: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && env.UV_LINUX_SHA256 || '' }}
            enable-cache: false

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}

        # Canary lock updates stay in this checkout.
        - name: Resolve the newest releases
          if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          env:
            UV_LOCKED: 0
          run: |
            uv lock --upgrade
            uv lock --upgrade --project .github/ci/polars1

        - name: Resolve the newest Vaex releases
          if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (matrix.python-version == '3.11' || matrix.python-version == '3.12')
          env:
            UV_LOCKED: 0
          run: uv lock --upgrade --project .github/ci/vaex

        - name: Test hamilton main package
          run: |
            uv sync --group test
            uv run pytest tests/ --cov=hamilton --ignore tests/integrations


        - name: Test integrations
          run: |
            uv sync --group test --extra pandera
            uv run pytest tests/integrations

        - name: Test MCP
          run: |
            uv sync --group test --extra mcp
            uv run pytest tests/plugins/test_h_mcp.py

        - name: Test openlineage
          env:
            HAMILTON_TEST_POSTGRES_URL: postgresql+psycopg2://hamilton:hamilton@localhost:5432/sales
          run: |
            uv sync --group test --extra openlineage
            uv run pytest tests/io/test_utils.py tests/plugins/test_pandas_extensions.py tests/plugins/test_h_openlineage.py

        - name: Test pandas
          run: |
            uv sync --group test
            uv run pytest plugin_tests/h_pandas

        - name: Test polars
          run: |
            uv sync --group test
            uv run pytest plugin_tests/h_polars

        # The main test group exercises Polars 2 and newer. This lock keeps the 1.x readers covered.
        - name: Test polars 1.x readers
          run: |
            uv run --project .github/ci/polars1 python -c "import polars; assert polars.__version__.startswith('1.'), polars.__version__; print('polars', polars.__version__)"
            uv run --project .github/ci/polars1 pytest tests/plugins/test_polars_extensions.py tests/plugins/test_polars_lazyframe_extensions.py

        - name: Test narwhals
          run: |
            uv sync --group test
            uv run pytest plugin_tests/h_narwhals

        - name: Test dask
          run: |
            uv sync --group test --extra dask
            uv run pytest plugin_tests/h_dask

        # the `ray` extra in pyproject.toml installs ray only on Python < 3.15
        - name: Test ray
          if: ${{ matrix.python-version == '3.11' || matrix.python-version == '3.12' || matrix.python-version == '3.13' || matrix.python-version == '3.14' }}
          env:
            RAY_ENABLE_UV_RUN_RUNTIME_ENV: 0 # https://github.com/ray-project/ray/issues/53848
          run: |
            uv sync --group test --extra ray
            uv run pytest plugin_tests/h_ray

        - name: Test pyspark
          env:
            PYSPARK_SUBMIT_ARGS: "--conf spark.sql.ansi.enabled=false pyspark-shell"
          run: |
            sudo apt-get install --no-install-recommends --yes default-jre
            uv sync --group test --group test-pyspark --extra pyspark
            uv run pytest plugin_tests/h_spark

        # Vaex's pandas and dask constraints would downgrade those packages in the main tests.
        - name: Test vaex
          if: ${{ matrix.python-version == '3.11' || matrix.python-version == '3.12' }}
          run: uv run --project .github/ci/vaex pytest plugin_tests/h_vaex

  notify-slack:
    name: "Notify Slack"
    needs: [static-checks, test]
    # Posts only in apache/hamilton, which holds the webhook secret: once for a first-attempt
    # scheduled run in which a job failed or hit its time limit (such a job ends cancelled while
    # the run does not), and once for a manual run with notify-slack on, whether it passed or failed.
    # `!cancelled()` stops GitHub from adding its implicit `success()`, which would skip this job
    # whenever a job it needs failed.
    if: >-
      !cancelled() && github.repository == 'apache/hamilton' && (
        (github.event_name == 'schedule' && github.run_attempt == 1 &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))) ||
        (github.event_name == 'workflow_dispatch' && inputs.notify-slack))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
        - name: Compose the message
          id: message
          env:
            GH_TOKEN: ${{ github.token }}
            API_URL: ${{ github.api_url }}
            REPO: ${{ github.repository }}
            RUN_ID: ${{ github.run_id }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            EVENT: ${{ github.event_name }}
            OUTCOME: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failed' || 'passed' }}
          run: |
            # One line per failed or timed-out step, as "job: step"; a failed job with no failed
            # step (one that died while setting up) is listed by its name alone. `$job` is jq's.
            # shellcheck disable=SC2016
            filter='def broken: .conclusion | IN("failure", "cancelled", "timed_out");
              .jobs[] | select(broken) | .name as $job
              | [.steps[]? | select(broken) | "\($job): \(.name)"]
              | if length > 0 then .[] else $job end'
            if ! failed=$(gh api "$API_URL/repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq "$filter"); then
              echo "::warning::Could not list the failed steps; the message links to the run instead."
              failed="(failed steps unavailable)"
            fi
            if [[ "$EVENT" == schedule ]]; then
              header="Hamilton latest-dependency CI failed:"
            else
              header="Test of Hamilton's CI Slack notification path from a manual run, which $OUTCOME."
            fi
            text=$(printf '%s\n' "$header" ${failed:+"$failed"} "$RUN_URL")
            echo "payload=$(jq --compact-output --null-input --arg text "$text" '{text: $text}')" >> "$GITHUB_OUTPUT"

        - name: Post to Slack
          uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
          with:
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
            errors: true
            payload: ${{ steps.message.outputs.payload }}
