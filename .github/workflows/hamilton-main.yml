name: Unit Tests

on:
  # No lockfile pins Hamilton's dependencies, so every run tests their newest releases. The daily
  # run tests `main` against them when nobody opens a pull request, and the notify-slack job
  # reports what broke. The minute is off the hour because GitHub delays or drops scheduled runs
  # at the top of the hour, when most schedules start.
  schedule:
    - cron: '17 4 * * *'

  # To check the Slack webhook, run this workflow by hand on `main` with notify-slack on.
  workflow_dispatch:
    inputs:
      notify-slack:
        description: 'Send a test Slack message with this run''s outcome (apache/hamilton only)'
        type: boolean
        default: false

  pull_request:
    branches:
        - main
    paths:
        - '.github/**'
        - 'examples/**'
        - 'hamilton/**'
        - 'plugin_tests/**'
        - 'tests/**'
        - 'pyproject.toml'
        # tests/test_redirect_packages.py renders every redirect package from these
        - 'scripts/render_redirect_pyproject.py'
        - 'sf-hamilton*-redirect/**'

jobs:
  static-checks:
    name: "Static Checks"
    # Every job in this workflow needs this guard: a fork's scheduled run would spend runner
    # time daily with no one to report to.
    if: github.event_name != 'schedule' || github.repository == 'apache/hamilton'
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install uv
          run: curl -LsSf https://astral.sh/uv/install.sh | sh

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Check linting with prek
          run: |
            uv sync --dev
            uv run prek run --all-files --hook-stage pre-merge-commit

  test:
    name: "Unit Tests"
    # Every job in this workflow needs this guard: a fork's scheduled run would spend runner
    # time daily with no one to report to.
    if: github.event_name != 'schedule' || github.repository == 'apache/hamilton'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # want to see for each version if fails are different
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    env:
      HAMILTON_TELEMETRY_ENABLED: false
    services:
      # disposable server for the SQL lineage tests; they create and drop their own schemas
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hamilton
          POSTGRES_PASSWORD: hamilton
          POSTGRES_DB: sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        - name: Install Graphviz on Linux
          if: runner.os == 'Linux'
          run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends graphviz

        - name: Install Graphviz on Windows
          if: runner.os == 'Windows'
          run: choco install graphviz
          shell: powershell

        - name: Install Graphviz on macOS
          if: runner.os == 'macOS'
          run: |
            brew install graphviz
            brew install libomp

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install uv
          run: curl -LsSf https://astral.sh/uv/install.sh | sh

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}

        - name: Test hamilton main package
          run: |
            uv sync --group test
            uv run pytest tests/ --cov=hamilton --ignore tests/integrations


        - name: Test integrations
          run: |
            uv sync --group test --extra pandera
            uv pip install -r tests/integrations/pandera/requirements.txt
            uv run pytest tests/integrations

        - name: Test MCP
          run: |
            uv sync --group test --extra mcp
            uv run pytest tests/plugins/test_h_mcp.py

        - name: Test openlineage
          env:
            HAMILTON_TEST_POSTGRES_URL: postgresql+psycopg2://hamilton:hamilton@localhost:5432/sales
          run: |
            uv sync --group test --extra openlineage
            uv pip install psycopg2-binary
            uv run pytest tests/io/test_utils.py tests/plugins/test_pandas_extensions.py tests/plugins/test_h_openlineage.py

        - name: Test pandas
          run: |
            uv sync --group test
            uv run pytest plugin_tests/h_pandas

        - name: Test polars
          run: |
            uv sync --group test
            uv pip install polars
            uv run pytest plugin_tests/h_polars

        - name: Test narwhals
          run: |
            uv sync --group test
            uv pip install polars pandas narwhals
            uv run pytest plugin_tests/h_narwhals

        - name: Test dask
          run: |
            uv sync --group test --extra dask
            uv run pytest plugin_tests/h_dask

        - name: Test ray
          if: ${{ matrix.python-version != '3.14' }}
          env:
            RAY_ENABLE_UV_RUN_RUNTIME_ENV: 0 # https://github.com/ray-project/ray/issues/53848
          run: |
            uv sync --group test --extra ray
            uv run pytest plugin_tests/h_ray

        - name: Test pyspark
          if: ${{ runner.os == 'Linux' }}
          env:
            PYSPARK_SUBMIT_ARGS: "--conf spark.sql.ansi.enabled=false pyspark-shell"
          run: |
            sudo apt-get install --no-install-recommends --yes default-jre
            uv sync --group test --extra pyspark
            uv pip install 'pyspark[connect]' 'grpcio'
            uv pip install --no-cache --reinstall --strict 'grpcio-status >= 1.48.1'
            uv run pytest plugin_tests/h_spark

        - name: Test pyspark
          if: ${{ runner.os != 'Linux' }}
          env:
            PYSPARK_SUBMIT_ARGS: "--conf spark.sql.ansi.enabled=false pyspark-shell"
          run: |
            uv sync --group test --extra pyspark
            uv pip install 'pyspark[connect]' 'grpcio'
            uv pip install --no-cache --reinstall --strict 'grpcio-status >= 1.48.1'
            uv run pytest plugin_tests/h_spark

        # Vaex 4.19 only ships wheels for py<=3.12 and pins dask<2024.9 / pandas<3, which conflicts
        # with the test group. Install it on top of the synced env rather than through the lock, otherwise
        # the universal resolution falls back to vaex 4.17 which has no wheels for py>=3.11.
        - name: Test vaex
          if: ${{ matrix.python-version == '3.11' || matrix.python-version == '3.12' }}
          run: |
            uv sync --group test
            uv pip install "vaex>=4.19"
            uv run --no-sync pytest plugin_tests/h_vaex

  notify-slack:
    name: "Notify Slack"
    needs: [static-checks, test]
    # Posts only in apache/hamilton, which holds the webhook secret: once for a first-attempt
    # scheduled run in which a job failed or hit its time limit (such a job ends cancelled while
    # the run does not), and once for a manual run with notify-slack on, whether it passed or failed.
    # `!cancelled()` stops GitHub from adding its implicit `success()`, which would skip this job
    # whenever a job it needs failed.
    if: >-
      !cancelled() && github.repository == 'apache/hamilton' && (
        (github.event_name == 'schedule' && github.run_attempt == 1 &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))) ||
        (github.event_name == 'workflow_dispatch' && inputs.notify-slack))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
        - name: Compose the message
          id: message
          env:
            GH_TOKEN: ${{ github.token }}
            API_URL: ${{ github.api_url }}
            REPO: ${{ github.repository }}
            RUN_ID: ${{ github.run_id }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            EVENT: ${{ github.event_name }}
            OUTCOME: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failed' || 'passed' }}
          run: |
            # One line per failed or timed-out step, as "job: step"; a failed job with no failed
            # step (one that died while setting up) is listed by its name alone. `$job` is jq's.
            # shellcheck disable=SC2016
            filter='def broken: .conclusion | IN("failure", "cancelled", "timed_out");
              .jobs[] | select(broken) | .name as $job
              | [.steps[]? | select(broken) | "\($job): \(.name)"]
              | if length > 0 then .[] else $job end'
            if ! failed=$(gh api "$API_URL/repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq "$filter"); then
              echo "::warning::Could not list the failed steps; the message links to the run instead."
              failed="(failed steps unavailable)"
            fi
            if [[ "$EVENT" == schedule ]]; then
              header="Hamilton latest-dependency CI failed:"
            else
              header="Test of Hamilton's CI Slack notification path from a manual run, which $OUTCOME."
            fi
            text=$(printf '%s\n' "$header" ${failed:+"$failed"} "$RUN_URL")
            echo "payload=$(jq --compact-output --null-input --arg text "$text" '{text: $text}')" >> "$GITHUB_OUTPUT"

        - name: Post to Slack
          uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
          with:
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
            errors: true
            payload: ${{ steps.message.outputs.payload }}
