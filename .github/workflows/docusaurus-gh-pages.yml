# Sample workflow for building and deploying a Docusaurus site to GitHub Pages
name: Deploy Docusaurus with GitHub Pages dependencies preinstalled

on:
  push:
    paths:
      - 'contrib/**'
      - '.github/workflows/docusaurus-gh-pages.yml'

  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  branch-build:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1000
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e .
      - name: Compile code to create pages
        working-directory: contrib/docs
        run: |
          pip install jinja2
          python compile_docs.py
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: "./contrib/docs/package-lock.json"
      - name: Install dependencies
        working-directory: contrib/docs
        run: npm ci
      - name: Build
        working-directory: contrib/docs
        run: npm run build
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 1000
      # 👇 Build steps
      - name: Set up Python 3.11
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e .
      - name: Compile code to create pages
        working-directory: contrib/docs
        run: |
          pip install jinja2
          python compile_docs.py
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: "./contrib/docs/package-lock.json"
      - name: Install dependencies
        working-directory: contrib/docs
        run: npm ci
      - name: Build
        working-directory: contrib/docs
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          # 👇 Specify build output path
          path: contrib/docs/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
