[project]
name = "hamilton-polars1-tests"
version = "0"
requires-python = ">=3.11,<4"
dependencies = [
  "apache-hamilton",
  "connectorx; python_version < '3.14'",
  "polars>=1,<2",
  "pyarrow",
  "pytest",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "xlsx2csv",
  "xlsxwriter",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
apache-hamilton = { path = "../../..", editable = true }
